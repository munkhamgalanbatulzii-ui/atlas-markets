name: Network diagnostics - MSE data sources

on:
  push:
    paths:
      - '.github/workflows/test-mse-network.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public stock market sources
        run: |
          python - <<'PY'
          import urllib.request,concurrent.futures
          urls=[
            'https://new.mse.mn/trade-daily-report',
            'https://www.mse.mn/',
            'https://www.mse.mn/trade-daily-report',
            'https://mse.mn/trade-daily-report',
            'https://open.mse.mn/',
            'https://stock.bbe.mn/Home/Index/',
          ]
          def probe(u):
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=12) as r:
                return (u,r.status,r.url,r.headers.get('content-type'),len(r.read(1024)))
            except Exception as e:
              return (u,'ERROR',str(e)[:160])
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            for row in pool.map(probe,urls):print(row,flush=True)
          PY
